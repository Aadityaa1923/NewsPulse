<!DOCTYPE html>
<html>
<head>
<title>NewsPulse CRM</title>
<style>
body{
font-family:Arial;
background:#0d1511;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:#182219;
padding:40px;
width:420px;
border-radius:24px;
box-shadow:0 15px 50px rgba(0,0,0,.35);
}

h1{
text-align:center;
color:#a8f542;
margin-bottom:20px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tabs button{
flex:1;
padding:12px;
border:none;
border-radius:30px;
background:#a8f542;
font-weight:bold;
cursor:pointer;
}

.form{
display:none;
}

.form.active{
display:block;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:none;
}

label{
font-size:14px;
color:#cdd5cc;
}

.topics{
margin:12px 0;
}

.topics label{
display:block;
margin:8px 0;
}

.submit{
width:100%;
padding:14px;
border:none;
border-radius:30px;
background:#a8f542;
font-weight:bold;
margin-top:15px;
cursor:pointer;
}

#msg{
margin-top:14px;
text-align:center;
}
</style>
</head>
<body>

<div class="card">
<h1>NewsPulse CRM</h1>

<div class="tabs">
<button onclick="showLogin()">Login</button>
<button onclick="showSignup()">Create Account</button>
</div>

<!-- LOGIN -->
<div id="loginForm" class="form active">
<input id="loginUser" placeholder="Email">
<input id="loginPass" type="password" placeholder="Password">

<button class="submit" onclick="login()">
Login
</button>
</div>

<!-- SIGNUP -->
<div id="signupForm" class="form">
<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<div class="topics">
<label><input type="checkbox" value="Economy"> Economy</label>
<label><input type="checkbox" value="Markets"> Markets</label>
<label><input type="checkbox" value="Geopolitics"> Geopolitics</label>
<label><input type="checkbox" value="Technology"> Technology</label>
</div>

<button class="submit" onclick="signup()">
Create Account
</button>
</div>

<p id="msg"></p>

</div>

<script>
function showLogin(){
document.getElementById('loginForm').classList.add('active');
document.getElementById('signupForm').classList.remove('active');
}

function showSignup(){
document.getElementById('signupForm').classList.add('active');
document.getElementById('loginForm').classList.remove('active');
}

async function signup(){

let topics=[];
document.querySelectorAll('input[type="checkbox"]:checked')
.forEach(c=>topics.push(c.value));

const res = await fetch('http://127.0.0.1:8000/signup',{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
name:document.getElementById('name').value,
email:document.getElementById('email').value,
password:document.getElementById('password').value,
interests:topics
})
});

const data=await res.json();
document.getElementById('msg').innerText=data.message;
}


async function login(){

const res=await fetch('http://127.0.0.1:8000/login',{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
username:document.getElementById('loginUser').value,
password:document.getElementById('loginPass').value
})
});

const data=await res.json();

if(data.status==='success'){
window.location.href='http://localhost:5500/crmfrontend.html';
}else{
document.getElementById('msg').innerText='Invalid credentials';
}

}
</script>

</body>
</html>
